<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius:16px;">
  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="42" fill="#0f172a" rx="16" ry="16"/>
  <rect x="0" y="24" width="900" height="18" fill="#0f172a"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="90" y="25" fill="#64748b" font-size="12" font-family="monospace">Gemini Reflection Studio — Step 04: OpenStreetMap Spatial Grounding &amp; Open-Meteo Weather</text>

  <!-- Main Map Container -->
  <rect x="40" y="65" width="820" height="425" fill="#0f172a" rx="16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Map Header Bar -->
  <rect x="60" y="85" width="320" height="34" fill="#1e293b" rx="8"/>
  <text x="80" y="107" fill="#f8fafc" font-size="13" font-weight="700">📍 Spatial Grounding &amp; Retreats</text>

  <rect x="400" y="85" width="440" height="34" fill="#062e24" rx="8" stroke="#059669" stroke-width="1"/>
  <text x="420" y="107" fill="#34d399" font-size="12" font-weight="600">Active Location: Kyoto Bamboo Sanctuary (35.01° N, 135.67° E)</text>

  <!-- Simulated Google Map Visual -->
  <rect x="60" y="135" width="780" height="230" fill="#081b26" rx="12" stroke="#1e293b"/>
  
  <!-- Map Grid Lines -->
  <path d="M 60 200 L 840 200 M 60 270 L 840 270 M 250 135 L 250 365 M 500 135 L 500 365 M 700 135 L 700 365" stroke="#133549" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Map Pins -->
  <circle cx="580" cy="230" r="18" fill="#10b981" fill-opacity="0.3"/>
  <circle cx="580" cy="230" r="8" fill="#10b981"/>
  <rect x="520" y="170" width="120" height="45" fill="#0f172a" rx="8" stroke="#10b981" stroke-width="1.5"/>
  <text x="580" y="188" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Kyoto Sanctuary</text>
  <text x="580" y="204" fill="#34d399" font-size="9.5" text-anchor="middle">Misty Zen • 18°C</text>

  <circle cx="280" cy="210" r="6" fill="#f59e0b"/>
  <rect x="230" y="160" width="100" height="36" fill="#0f172a" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="280" y="178" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Alpine Cabin</text>
  <text x="280" y="190" fill="#f59e0b" font-size="8.5" text-anchor="middle">Snowy Focus • -2°C</text>

  <circle cx="150" cy="260" r="6" fill="#3b82f6"/>
  <rect x="100" y="280" width="100" height="36" fill="#0f172a" rx="6" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="298" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">SF Workspace</text>
  <text x="150" y="310" fill="#60a5fa" font-size="8.5" text-anchor="middle">Sunny • 21°C</text>

  <!-- Bottom Details Bar -->
  <rect x="60" y="380" width="780" height="90" fill="#090d16" rx="10" stroke="#1e293b"/>
  <text x="85" y="410" fill="#94a3b8" font-size="12" font-weight="700">Spatial Context Grounding Engine:</text>
  <text x="85" y="432" fill="#cbd5e1" font-size="12">Coordinates and atmospheric conditions (weather, tranquility, altitude) are infused into Gemini's cognitive persona,</text>
  <text x="85" y="452" fill="#cbd5e1" font-size="12">enabling place-aware mindfulness and contextual life reflections.</text>
</svg>
