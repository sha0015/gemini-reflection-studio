<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius:16px;">
  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="42" fill="#0f172a" rx="16" ry="16"/>
  <rect x="0" y="24" width="900" height="18" fill="#0f172a"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="90" y="25" fill="#64748b" font-size="12" font-family="monospace">Gemini Reflection Studio — Step 03: Multi-Turn Reasoning &amp; Auto-Extracted Action Items</text>

  <!-- Left Column: Gemini Reflection Stream -->
  <rect x="40" y="65" width="460" height="425" fill="#0f172a" rx="16" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="60" y="85" width="160" height="28" fill="#064e3b" rx="6"/>
  <text x="72" y="104" fill="#34d399" font-size="12" font-weight="700">✦ Gemini 3.6 Flash</text>

  <text x="60" y="145" fill="#f8fafc" font-size="14" font-weight="600">Cognitive Reflection Mirror</text>
  <text x="60" y="175" fill="#cbd5e1" font-size="13">"When designing for zero-knowledge isolation, think of</text>
  <text x="60" y="197" fill="#cbd5e1" font-size="13">database rules as your mathematical boundary. The Kyoto</text>
  <text x="60" y="219" fill="#cbd5e1" font-size="13">bamboo forest metaphor represents quiet stability amidst rapid</text>
  <text x="60" y="241" fill="#cbd5e1" font-size="13">engineering velocity."</text>

  <!-- Tone & Tags -->
  <rect x="60" y="275" width="170" height="30" fill="#062e24" rx="6" stroke="#059669" stroke-width="1"/>
  <text x="75" y="295" fill="#6ee7b7" font-size="11.5" font-weight="600">Emotional Tone: Serene &amp; Focused</text>

  <rect x="240" y="275" width="120" height="30" fill="#1e293b" rx="6"/>
  <text x="255" y="295" fill="#94a3b8" font-size="11.5">#Architecture #Zen</text>

  <!-- Multi-Turn Follow-Up Prompt -->
  <rect x="60" y="325" width="420" height="135" fill="#090d16" rx="10" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="352" fill="#64748b" font-size="11" font-family="monospace">MULTI-TURN INQUIRY</text>
  <text x="75" y="380" fill="#e2e8f0" font-size="12.5">"How should we structure our automated Slack alerts?"</text>
  <rect x="330" y="405" width="135" height="36" fill="#10b981" rx="8"/>
  <text x="397" y="428" fill="#022c22" font-size="12" font-weight="700" text-anchor="middle">Continue Turn →</text>

  <!-- Right Column: Auto-Synthesized Action Items & Executive Summary -->
  <rect x="520" y="65" width="340" height="425" fill="#0f172a" rx="16" stroke="#1e293b" stroke-width="1.5"/>
  
  <text x="545" y="100" fill="#f8fafc" font-size="14" font-weight="700">Auto-Synthesized Action Items</text>
  <text x="545" y="120" fill="#64748b" font-size="11">Extracted via Structured JSON Schema</text>

  <!-- Checkboxes -->
  <rect x="545" y="140" width="290" height="46" fill="#090d16" rx="8" stroke="#1e293b"/>
  <circle cx="565" cy="163" r="8" fill="#10b981"/>
  <text x="565" y="167" fill="#ffffff" font-size="10" text-anchor="middle">✓</text>
  <text x="585" y="167" fill="#cbd5e1" font-size="12">Deploy firestore.rules to project</text>

  <rect x="545" y="196" width="290" height="46" fill="#090d16" rx="8" stroke="#1e293b"/>
  <circle cx="565" cy="219" r="8" fill="#10b981"/>
  <text x="565" y="223" fill="#ffffff" font-size="10" text-anchor="middle">✓</text>
  <text x="585" y="223" fill="#cbd5e1" font-size="12">Tag Kyoto spatial coordinates</text>

  <rect x="545" y="252" width="290" height="46" fill="#090d16" rx="8" stroke="#1e293b"/>
  <circle cx="565" cy="275" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="585" y="279" fill="#94a3b8" font-size="12">Send digest to Slack Block Kit</text>

  <!-- Executive Summary Card -->
  <rect x="545" y="318" width="290" height="150" fill="#062e24" rx="10" stroke="#059669" stroke-width="1"/>
  <text x="565" y="345" fill="#34d399" font-size="12" font-weight="700">Executive Summary</text>
  <text x="565" y="372" fill="#a7f3d0" font-size="11.5">Architected user-isolated reflection flow</text>
  <text x="565" y="392" fill="#a7f3d0" font-size="11.5">combining Gemini 3.6 Flash reasoning with</text>
  <text x="565" y="412" fill="#a7f3d0" font-size="11.5">ambient spatial grounding and zero-trust</text>
  <text x="565" y="432" fill="#a7f3d0" font-size="11.5">database rules.</text>
