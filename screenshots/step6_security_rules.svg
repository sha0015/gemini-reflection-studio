<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius:16px;">
  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="42" fill="#0f172a" rx="16" ry="16"/>
  <rect x="0" y="24" width="900" height="18" fill="#0f172a"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="90" y="25" fill="#64748b" font-size="12" font-family="monospace">Gemini Reflection Studio — Step 06: Zero-Knowledge Firestore Rules Proof &amp; Admin RBAC</text>

  <!-- Left Card: Rules Code -->
  <rect x="40" y="65" width="460" height="425" fill="#0f172a" rx="16" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="60" y="85" width="180" height="28" fill="#064e3b" rx="6"/>
  <text x="72" y="104" fill="#34d399" font-size="12" font-weight="700">🛡️ Deployed firestore.rules</text>

  <!-- Code Block -->
  <rect x="60" y="130" width="420" height="335" fill="#090d16" rx="10" stroke="#1e293b"/>
  <text x="80" y="160" fill="#6ee7b7" font-size="11.5" font-family="monospace">rules_version = '2';</text>
  <text x="80" y="185" fill="#38bdf8" font-size="11.5" font-family="monospace">service cloud.firestore &#123;</text>
  <text x="100" y="210" fill="#cbd5e1" font-size="11.5" font-family="monospace">match /databases/&#123;database&#125;/documents &#123;</text>
  
  <text x="120" y="240" fill="#94a3b8" font-size="11" font-family="monospace">// Default Deny All</text>
  <text x="120" y="260" fill="#f87171" font-size="11.5" font-family="monospace">match /&#123;document=**&#125; &#123; allow read, write: if false; &#125;</text>

  <text x="120" y="295" fill="#34d399" font-size="11" font-family="monospace">// Strictly Owner-Bound Subcollection</text>
  <text x="120" y="315" fill="#a7f3d0" font-size="11.5" font-family="monospace">match /users/&#123;userId&#125;/entries/&#123;entryId&#125; &#123;</text>
  <text x="140" y="340" fill="#fbbf24" font-size="11.5" font-family="monospace">allow read, write: if request.auth != null</text>
  <text x="260" y="365" fill="#fbbf24" font-size="11.5" font-family="monospace">&amp;&amp; request.auth.uid == userId;</text>
  <text x="120" y="390" fill="#a7f3d0" font-size="11.5" font-family="monospace">&#125;</text>
  <text x="100" y="415" fill="#cbd5e1" font-size="11.5" font-family="monospace">&#125;</text>
  <text x="80" y="440" fill="#38bdf8" font-size="11.5" font-family="monospace">&#125;</text>

  <!-- Right Card: Live Audit & RBAC Telemetry -->
  <rect x="520" y="65" width="340" height="425" fill="#0f172a" rx="16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="545" y="100" fill="#f8fafc" font-size="14" font-weight="700">Real-Time Access Control Audit</text>

  <!-- Test 1 -->
  <rect x="545" y="130" width="290" height="70" fill="#090d16" rx="8" stroke="#059669"/>
  <text x="565" y="155" fill="#34d399" font-size="12" font-weight="700">✓ Owner Query (/users/uid1/entries)</text>
  <text x="565" y="175" fill="#6ee7b7" font-size="11">auth.uid == uid1 → 200 OK (Allowed)</text>

  <!-- Test 2 -->
  <rect x="545" y="215" width="290" height="70" fill="#090d16" rx="8" stroke="#dc2626"/>
  <text x="565" y="240" fill="#f87171" font-size="12" font-weight="700">✗ Foreign Query (/users/uid2/entries)</text>
  <text x="565" y="260" fill="#fca5a5" font-size="11">auth.uid != uid2 → 403 PERMISSION_DENIED</text>

  <!-- Test 3 -->
  <rect x="545" y="300" width="290" height="70" fill="#090d16" rx="8" stroke="#dc2626"/>
  <text x="565" y="325" fill="#f87171" font-size="12" font-weight="700">✗ Unauthenticated Access</text>
  <text x="565" y="345" fill="#fca5a5" font-size="11">auth == null → 401 UNAUTHENTICATED</text>

  <!-- Bottom Badge -->
  <rect x="545" y="385" width="290" height="80" fill="#062e24" rx="8" stroke="#047857"/>
  <text x="565" y="415" fill="#34d399" font-size="12" font-weight="700">Mathematical Guarantee:</text>
  <text x="565" y="438" fill="#a7f3d0" font-size="11">Zero user data cross-contamination possible.</text>
</svg>
